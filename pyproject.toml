[project]
name = "singularis-rf"
version = "0.1.0"
description = "Singularis Prime over amateur-radio text modes: RX-only Singularis Compact station (Direwolf/JS8Call → NATS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "SEE LICENSE IN LICENSE" }
dependencies = ["nats-py>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
singularis-rf = "singularis_rf.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["singularis_rf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/kannaka-labs/singularis-rf"
Repository = "https://github.com/kannaka-labs/singularis-rf"
Issues = "https://github.com/kannaka-labs/singularis-rf/issues"
