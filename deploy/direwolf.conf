# Direwolf configuration — RECEIVE ONLY.
# No PTT, no beacons, no digipeating, no IGate. Audio comes in on stdin (see run-rx.sh):
# either rtl_fm from an RTL-SDR dongle, or a WAV for the self-test.
ADEVICE stdin null
ARATE 22050
ACHANNELS 1
CHANNEL 0
# The station identifier is informational here; this instance never transmits.
MYCALL RXONLY
MODEM 1200
# KISS over TCP for the Singularis station (loopback only inside the container).
KISSPORT 8001
AGWPORT 0
# Keep decoded packets on stdout for the container log as well.
LOGDIR /data/direwolf
